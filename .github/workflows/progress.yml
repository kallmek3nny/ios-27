name: capability progress
on:
  push:
    branches: [main]
    paths: [tools/refresh_repo_status.py, docs/repo-status.json, .github/workflows/refresh-progress.yml, docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, tools/compat_blocks.cjs, docs/compat-targets.json, docs/blocks.svg, docs/blocks.html, docs/BLOCKS.md, .github/workflows/progress.yml]
  pull_request:
    branches: [main]
    paths: [tools/refresh_repo_status.py, docs/repo-status.json, .github/workflows/refresh-progress.yml, docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, tools/compat_blocks.cjs, docs/compat-targets.json, docs/blocks.svg, docs/blocks.html, docs/BLOCKS.md, .github/workflows/progress.yml]
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: validate documented milestone gates and generated dashboard
        run: |
          timeout 15s python3 tools/refresh_repo_status.py --self-test
          timeout 15s python3 tools/progress.py --check
          timeout 15s node --check tools/compat_blocks.cjs
          timeout 15s node tools/compat_blocks.cjs --check

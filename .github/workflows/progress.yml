name: capability progress
on:
  push:
    branches: [main]
    paths: [tools/refresh_repo_status.py, tools/scan_branch_activity.py, tools/phase_delivery.py, docs/phase-delivery.json, docs/phase-delivery.svg, docs/DELIVERY.md, README.md, docs/repo-status.json, docs/branch-activity.json, docs/BRANCHES.md, .github/workflows/refresh-progress.yml, docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, tools/compat_blocks.cjs, docs/compat-targets.json, docs/blocks.svg, docs/engineering.svg, docs/blocks.html, docs/BLOCKS.md, docs/CEILINGS.md, src/objc_metadata.c, src/objc_runtime.c, src/objc_bridge.c, src/libsystem_user.c, tools/phase19e-standalone.py, tests/phase19e-standalone.c, tests/fixtures/phase19e-objc-classes.m, .github/workflows/progress.yml]
  pull_request:
    branches: [main]
    paths: [tools/refresh_repo_status.py, tools/scan_branch_activity.py, tools/phase_delivery.py, docs/phase-delivery.json, docs/phase-delivery.svg, docs/DELIVERY.md, README.md, docs/repo-status.json, docs/branch-activity.json, docs/BRANCHES.md, .github/workflows/refresh-progress.yml, docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, tools/compat_blocks.cjs, docs/compat-targets.json, docs/blocks.svg, docs/engineering.svg, docs/blocks.html, docs/BLOCKS.md, docs/CEILINGS.md, src/objc_metadata.c, src/objc_runtime.c, src/objc_bridge.c, src/libsystem_user.c, tools/phase19e-standalone.py, tests/phase19e-standalone.c, tests/fixtures/phase19e-objc-classes.m, .github/workflows/progress.yml]
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: validate documented milestone gates and generated dashboard
        run: |
          timeout 15s python3 tools/refresh_repo_status.py --self-test
          timeout 15s python3 tools/scan_branch_activity.py --self-test
          timeout 15s python3 tools/phase_delivery.py --self-test
          timeout 15s python3 tools/phase_delivery.py --check
          timeout 15s python3 tools/progress.py --check
          timeout 15s node --check tools/compat_blocks.cjs
          timeout 15s node tools/compat_blocks.cjs --check

  standalone-objc-libsystem:
    name: standalone objc/libsystem (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: compile and test compiler-produced objc2 and guest libsystem fixtures
        run: timeout 180s python3 tools/phase19e-standalone.py

  independent-compat-prototypes:
    name: phase20/21 standalone evidence (${{ matrix.suite }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        suite: [objc-metadata-dispatch, ownership-services, threading-lifecycle]
    steps:
      - uses: actions/checkout@v4
      - name: compile and execute compiler-produced phase20/21 fixtures with -Werror
        run: |
          case "${{ matrix.suite }}" in
            objc-metadata-dispatch)
              timeout 180s python3 tools/phase20a-standalone.py
              timeout 300s bash tools/phase20b-verify.sh
              ;;
            ownership-services)
              timeout 180s python3 tools/phase20c-build.py
              timeout 180s python3 tools/phase20e-standalone.py
              ;;
            threading-lifecycle)
              timeout 180s python3 tools/phase20d-standalone.py
              timeout 300s python3 tools/phase21g-standalone.py
              timeout 300s python3 tools/phase21h-standalone.py
              ;;
            *)
              exit 1
              ;;
          esac

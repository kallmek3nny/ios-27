name: capability progress
on:
  push:
    branches: [main]
    paths: [docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, .github/workflows/progress.yml]
  pull_request:
    branches: [main]
    paths: [docs/progress.json, docs/progress.svg, docs/PROGRESS.md, tools/progress.py, .github/workflows/progress.yml]
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: validate documented milestone gates and generated dashboard
        run: timeout 15s python3 tools/progress.py --check

name: phase21j independent synchronization diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: native-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: verify host architecture and bounded native tests
        run: timeout 360s python3 tools/phase21j-standalone.py
        env:
          PHASE21J_REPORT_PATH: ${{ runner.temp }}/phase21j-evidence.json
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: reject missing, skipped, or inconsistent native test evidence
        run: timeout 30s python3 tools/phase21j-verify-evidence.py "${{ runner.temp }}/phase21j-evidence.json"
        env:
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: publish successful bounded test timing and frozen-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase21j-${{ matrix.arch }}-gcc
          path: ${{ runner.temp }}/phase21j-evidence.json
          if-no-files-found: error
          retention-days: 14

  memory-safety:
    name: asan-ubsan-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: bounded address/undefined behavior and leak checks
        run: |
          timeout 360s env ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tools/phase21j-standalone.py --sanitize
        env:
          PHASE21J_REPORT_PATH: ${{ runner.temp }}/phase21j-evidence.json
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: reject missing, skipped, or inconsistent native test evidence
        run: timeout 30s python3 tools/phase21j-verify-evidence.py "${{ runner.temp }}/phase21j-evidence.json"
        env:
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: publish successful bounded test timing and frozen-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase21j-${{ matrix.arch }}-sanitizer
          path: ${{ runner.temp }}/phase21j-evidence.json
          if-no-files-found: error
          retention-days: 14

  stress:
    name: stress-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: eight-pass bounded high-contention campaigns
        run: timeout 360s python3 tools/phase21j-standalone.py --stress
        env:
          PHASE21J_REPORT_PATH: ${{ runner.temp }}/phase21j-evidence.json
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: reject missing, skipped, or inconsistent native test evidence
        run: timeout 30s python3 tools/phase21j-verify-evidence.py "${{ runner.temp }}/phase21j-evidence.json"
        env:
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: publish successful bounded test timing and frozen-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase21j-${{ matrix.arch }}-stress
          path: ${{ runner.temp }}/phase21j-evidence.json
          if-no-files-found: error
          retention-days: 14

  clang:
    name: clang-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: native Clang compiler -Werror O0/O2 integration
        run: timeout 360s env CC=clang python3 tools/phase21j-standalone.py
        env:
          PHASE21J_REPORT_PATH: ${{ runner.temp }}/phase21j-evidence.json
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: reject missing, skipped, or inconsistent native test evidence
        run: timeout 30s python3 tools/phase21j-verify-evidence.py "${{ runner.temp }}/phase21j-evidence.json"
        env:
          PHASE21J_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: publish successful bounded test timing and frozen-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase21j-${{ matrix.arch }}-clang
          path: ${{ runner.temp }}/phase21j-evidence.json
          if-no-files-found: error
          retention-days: 14

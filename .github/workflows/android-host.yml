name: Android runtime host
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native preview transport
        run: |
          javac --release 17 -Xlint:all -Werror -d "$RUNNER_TEMP/frame-tests" \
            android/app/src/main/java/org/ios27/host/FrameFile.java \
            android/app/src/main/java/org/ios27/host/FrameRing.java \
            android/app/src/main/java/org/ios27/host/TouchStream.java \
            android/app/src/test/java/org/ios27/host/FrameFileTest.java \
            android/app/src/test/java/org/ios27/host/FrameRingTest.java \
            android/app/src/test/java/org/ios27/host/TouchStreamTest.java
          java -cp "$RUNNER_TEMP/frame-tests" org.ios27.host.FrameFileTest
          java -cp "$RUNNER_TEMP/frame-tests" org.ios27.host.FrameRingTest
          java -cp "$RUNNER_TEMP/frame-tests" org.ios27.host.TouchStreamTest
      - name: Verify simulator thread-register adapter
        run: python3 integration/darling/tests/simulator-thread-registers.py --fetch-pinned
      - name: Verify simulator cache thread registers
        run: python3 integration/darling/tests/simulator-cache-tsd.py --fetch-pinned
      - name: Verify pthread workgroup callback bridge
        run: python3 integration/darling/tests/pthread-workgroup.py --fetch-pinned
      - name: Verify asynchronous kevent workqueue
        run: python3 integration/darling/tests/kevent-workqueue.py --fetch-pinned
      - name: Verify native workloops
        run: python3 integration/darling/tests/workloops.py --fetch-pinned
      - name: Verify simulator spawn lifecycle
        run: python3 integration/darling/tests/spawn-lifecycle.py --fetch-pinned
      - name: Verify spawn policy handoff
        run: python3 integration/darling/tests/spawn-policy.py --fetch-pinned
      - name: Verify native Mach message adapter
        run: python3 integration/darling/tests/mach-msg2.py --fetch-pinned
      - name: Verify migrating server fiber TLS
        run: python3 integration/darling/tests/fiber-tls.py --fetch-pinned
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.13846066' 'cmake;3.22.1'
      - name: Build and lint both host ABIs
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ios27-runtime-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

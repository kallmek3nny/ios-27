name: Android runtime host
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.13846066' 'cmake;3.22.1'
      - name: Build and lint both host ABIs
        run: bash android/gradlew -p android :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ios27-runtime-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

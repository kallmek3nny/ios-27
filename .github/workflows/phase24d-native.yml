name: phase24d modeled Darwin services and ARM64 linkage
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/phase24d_*'
      - 'include/ios27/phase24d_*'
      - 'tests/phase24d-*'
      - 'tools/phase24d-*'
      - 'docs/phase24d-*'
      - '.github/workflows/phase24d-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase24d:
    name: phase24d / ${{ matrix.runner }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [normal, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain provenance
        run: |
          timeout 30s uname -m
          timeout 30s clang --version
          timeout 30s cc --version
      - name: require LLVM Mach-O linker
        run: |
          if ! command -v ld64.lld >/dev/null 2>&1 && ! command -v ld64.lld-18 >/dev/null 2>&1; then
            timeout 120s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y lld
          fi
          timeout 30s bash -c 'command -v ld64.lld || command -v ld64.lld-20 || command -v ld64.lld-19 || command -v ld64.lld-18'
      - name: bounded host execution, stress, sanitizers and genuine arm64 darwin linkage
        env:
          PHASE24D_SANITIZE: ${{ matrix.mode == 'sanitizers' && '1' || '0' }}
        run: timeout 300s python3 tools/phase24d-verify.py

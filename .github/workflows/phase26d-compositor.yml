name: phase26d compositor reference and objc metadata

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/phase26d_*'
      - 'include/ios27/phase26d_*'
      - 'tests/phase26d-*'
      - 'tools/phase26d-*'
      - 'docs/phase26d-*'
      - '.github/workflows/phase26d-compositor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-reference:
    name: reference / ${{ matrix.runner }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        mode: [normal, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain provenance
        run: |
          timeout 30s uname -m
          timeout 30s git rev-parse HEAD
          timeout 30s clang --version
      - name: strict standalone C build
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic -pthread"
          if [ "${{ matrix.mode }}" = sanitize ]; then
            flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          timeout 300s clang $flags -Iinclude src/phase26d_compositor.c tests/phase26d-core.c -lm -o /tmp/phase26d-core
      - name: deterministic pixels, stress, fuzz, race verification
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: timeout 180s /tmp/phase26d-core
      - name: genuine clang arm64 darwin ObjC2 metadata fixture (not executed)
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s clang --target=arm64-apple-darwin -fobjc-runtime=macosx-10.15 -Werror -c tests/phase26d-objc-fixture.m -o /tmp/phase26d-objc.o
          timeout 30s file /tmp/phase26d-objc.o
          timeout 30s file /tmp/phase26d-objc.o | grep -E 'Mach-O.*(arm64|ARM64)'
          timeout 30s strings /tmp/phase26d-objc.o | grep PH26DLayer

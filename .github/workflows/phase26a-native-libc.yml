name: phase26a standalone native libc abi
on:
  pull_request:
    paths:
      - 'src/phase26a_*'
      - 'include/ios27/phase26a_*'
      - 'tests/phase26a-*'
      - 'tools/phase26a-*'
      - 'docs/phase26a-*'
      - '.github/workflows/phase26a-native-libc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libc-abi:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ensure native Darwin LLVM linker
        run: |
          set -euo pipefail
          if ! command -v ld64.lld >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y lld
          fi
          timeout 30s clang --version
          timeout 30s ld64.lld --version
      - name: independent compiler-linked fixtures and native runtime
        run: |
          set -euo pipefail
          timeout 30s uname -m
          timeout 900s python3 tools/phase26a-verify.py
      - name: address and undefined behavior sanitizers
        if: matrix.runner == 'ubuntu-24.04'
        env:
          PHASE26A_SANITIZE: '1'
        run: timeout 900s python3 tools/phase26a-verify.py

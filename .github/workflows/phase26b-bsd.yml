name: phase26b isolated bsd capabilities

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/phase26b_*'
      - 'include/ios27/phase26b_*'
      - 'tests/phase26b-*'
      - 'tools/phase26b-*'
      - 'docs/phase26b-*'
      - '.github/workflows/phase26b-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: bsd native / ${{ matrix.runner }} / ${{ matrix.sanitize }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - name: install darwin llvm linker
        run: |
          timeout 120s sudo apt-get update -qq
          timeout 120s sudo apt-get install -y -qq lld-18
      - name: toolchain
        run: |
          timeout 30s clang --version
          timeout 30s cc --version
          timeout 30s ld64.lld-18 --version
      - name: phase26b independent tests and linked Darwin fixture
        env:
          PHASE26B_SANITIZE: ${{ matrix.sanitize }}
        run: timeout 300s python3 tools/phase26b-verify.py

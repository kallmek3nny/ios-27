name: phase19b real linked darwin dylibs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-dylibs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: install open-source Mach-O linker
        run: |
          timeout 120s sudo apt-get update -qq
          timeout 120s sudo apt-get install -y lld clang
      - name: configure
        run: timeout 120s cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIOS27_BUILD_TESTS=ON
      - name: build
        run: timeout 300s cmake --build build --parallel 2
      - name: genuine compiler-linked four-image graph
        run: timeout 180s python3 tools/phase19b-build.py --output-dir build/phase19b --core build/libios27_core.a
      - name: native services, named shim and CPU expiry with LLVM
        run: |
          set -o pipefail
          timeout 360s ctest --test-dir build -R '^(contained-native-services(-fallback)?|contained-native-service-shim|contained-native-cpu-expiry|service-binding-metadata|static-executable-rebases)$' --no-tests=error --timeout 30 --output-on-failure 2>&1 | tee "$RUNNER_TEMP/phase19b-native-ctest.log"
      - name: fail ARM64 job if any native suite skipped
        if: runner.arch == 'ARM64'
        run: |
          log="$RUNNER_TEMP/phase19b-native-ctest.log"
          if grep -Eq '\*\*\*(Skipped|Not Run)|\((Skipped|Not Run)\)' "$log"; then
            echo "::error::a native suite skipped or did not run on ARM64, so native execution stays unproven"
            grep -E '\*\*\*(Skipped|Not Run)|\((Skipped|Not Run)\)' "$log"
            exit 1
          fi
          for t in contained-native-services contained-native-services-fallback contained-native-service-shim contained-native-cpu-expiry service-binding-metadata static-executable-rebases; do
            if ! grep -Eq "Test +#[0-9]+: ${t} [.]* *Passed" "$log"; then
              echo "::error::${t} did not report Passed on ARM64"
              exit 1
            fi
          done

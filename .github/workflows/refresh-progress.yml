name: refresh compatibility provenance

on:
  workflow_run:
    workflows: ["native tests"]
    types: [completed]
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: ios27-progress-main
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: refresh merged-main provenance and unmerged candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 120s python3 tools/refresh_repo_status.py --repo "$GITHUB_REPOSITORY" --output docs/repo-status.json
          timeout 15s python3 tools/progress.py
          timeout 15s node tools/compat_blocks.cjs
          timeout 15s python3 tools/progress.py --check
          timeout 15s node tools/compat_blocks.cjs --check
      - name: publish only if main has not moved
        run: |
          timeout 15s git add docs/repo-status.json docs/PROGRESS.md docs/progress.svg docs/blocks.svg docs/BLOCKS.md docs/blocks.html
          if ! timeout 15s git diff --cached --quiet; then
            timeout 15s git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(progress): refresh merged main and branch evidence'
            if ! timeout 30s git push origin HEAD:main; then
              remote_head="$(timeout 30s git ls-remote origin refs/heads/main | timeout 5s cut -f1)"
              expected_head="$(timeout 15s git rev-parse HEAD^)"
              if [ "$remote_head" != "$expected_head" ]; then
                echo "::notice::main advanced while refreshing; skip safely and retry after the next build or on schedule"
              else
                echo "::error::progress push failed without a moved main branch"
                exit 1
              fi
            fi
          fi

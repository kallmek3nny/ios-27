name: phase25b native arm64 objc dispatch
on:
  pull_request:
    paths:
      - 'src/phase25b_*'
      - 'include/ios27/phase25b_*'
      - 'tests/phase25b-*'
      - 'tools/phase25b-*'
      - 'docs/phase25b-*'
      - '.github/workflows/phase25b-*.yml'
  workflow_dispatch:
jobs:
  compiler-linked-dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        sanitize: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: arm64 clang and lld toolchain
        run: |
          timeout 120s sudo apt-get update -qq
          timeout 120s sudo apt-get install -y clang lld
      - name: metadata, linked Mach-O fixture and native dispatch verification
        env:
          PHASE25B_SANITIZE: ${{ matrix.sanitize }}
        run: timeout 180s bash tools/phase25b-verify.sh

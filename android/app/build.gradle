plugins { id 'com.android.application' }

def sessionPreview = providers.gradleProperty('sessionPreview').isPresent()

android {
    namespace 'org.ios27.host'
    compileSdk 35
    ndkVersion '29.0.13846066'
    defaultConfig {
        applicationId sessionPreview ? 'org.ios27.host.sessionpreview' : 'org.ios27.host'
        manifestPlaceholders = [appLabel: sessionPreview ? 'ios-27 Session Preview' : 'ios-27 Runtime']
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { targets 'ios27_android_runner', 'ios27_android_loader' } }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/fixture-assets')
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
}

def fixtureDir = layout.buildDirectory.dir('generated/fixture')
def repo = rootProject.projectDir.parentFile
def windows = System.getProperty('os.name').toLowerCase().contains('windows')
tasks.register('generateFixture', Exec) {
    inputs.files(fileTree(new File(repo, 'include')), fileTree(new File(repo, 'src')), fileTree(new File(repo, 'tools')), new File(repo, 'tests/fixtures/service-shim-client.c'))
    outputs.dir fixtureDir
    doFirst {
        def dest = fixtureDir.get().asFile
        dest.mkdirs()
        def host = windows ? 'windows-x86_64' : (System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64')
        def bin = new File(android.ndkDirectory, 'toolchains/llvm/prebuilt/' + host + '/bin')
        commandLine(windows ? 'python' : 'python3', new File(repo, 'tools/service-shim-build.py'), '--clang', new File(bin, windows ? 'clang.exe' : 'clang'), '--linker', new File(bin, windows ? 'ld.lld.exe' : 'ld.lld'), '--out', new File(dest, 'service-shim-executable'), '--manifest', new File(dest, 'service-shim-symbols.json'))
    }
}
tasks.register('packageFixture', Sync) {
    dependsOn 'generateFixture'
    from(fixtureDir) { include 'service-shim-executable', 'service-shim-symbols.json' }
    into layout.buildDirectory.dir('generated/fixture-assets')
}
tasks.named('preBuild').configure { dependsOn 'packageFixture' }

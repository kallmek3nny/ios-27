plugins { id 'com.android.application' }

android {
    namespace 'dev.ios27.host'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.ios27.phase26e'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cFlags '-std=c11 -Wall -Wextra -Wpedantic -Werror' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}